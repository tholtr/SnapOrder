# 集成测试专用配置（完整拷贝）：
# Spring Boot 不会合并 src/main 与 src/test 的同名 application.yaml，
# test resources 里的是完整替换——这里必须包含数据源等基础配置，
# 缺任何一段都会报 "Failed to determine a suitable driver class"（实测踩过）。
#
# 与主配置的三处刻意差异：
#   1. dash.auth.allow-header-identity: true —— 保留 X-User-Id 后门，
#      既有集成测试与压测都靠它直接指定身份
#   2. dash.mq.enabled: false —— 集成测试不依赖外部 broker
#   3. dash.risk.device-hmac-secret —— 测试用明文常量。主配置那份是环境变量占位符，
#      而测试进程不会带这个环境变量；不显式写值就会因 RiskProperties 的构造器校验
#      启动失败（测试环境无安全性要求，明文即可）
server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 500

spring:
  application:
    name: campus-dash
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/campus_dash?useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: dash123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
      timeout: 2000ms

dash:
  worker-id: 1
  auth:
    allow-header-identity: true
    arbitrator-id: 9001
    session-ttl-minutes: 120
    refresh-ttl-minutes: 10080
  settle:
    commission-rate: 0.05
    auto-settle-seconds: 86400
  mq:
    enabled: false
    endpoints: 127.0.0.1:8081
  timeout:
    confirm-seconds: 300
    max-transfer-rounds: 5
  grab:
    limit:
      # 并发正确性集成测试要压 Lua + DB CAS 本体，不让 P7 治理层提前拦流
      enabled: false
      per-second: 500
  risk:
    enabled: true
    # 测试密钥：一眼可辨的明文，且带 test-only 前缀便于全仓 grep 确认它没被复制到生产配置
    device-hmac-secret: test-only-not-a-secret
    test-context-enabled: false
    trusted-proxy-cidrs: ""
    # P9.2 三项，蓝图 §3.10 的配置示例里本来就有，P9.1 用不上所以没落。
    # mode 保持 SHADOW 与生产默认一致：需要 ENFORCE 的用例（限频键的读写断言）
    # 自己用 @TestPropertySource 覆盖，不让「测试里默认就是真拦截」成为隐性前提。
    mode: SHADOW
    # P9.3 两项。值与生产默认一致（放行 + 10ms 预算）：需要「预算耗尽」场景的用例
    # 自己用 @TestPropertySource 覆盖成 deadline-ms=0，不让「测试里默认就在降级」
    # 成为隐性前提。0 是合法值，见 RiskProperties 的 requireNonNegativeDeadline。
    deadline-ms: 10
    fail-open: true
    limit-cooldown-ms: 10000
    rule-version: "1"
    user-window:
      short-seconds: 10
      short-threshold: 5
      long-seconds: 60
      long-threshold: 30
    device-window:
      seconds: 600
      threshold: 8
      # 低阈值（REVIEW），P9.2 新增。必须严格小于上面的高阈值（BLOCK），
      # 否则低档规则永远走不到，RiskProperties 启动即拒。
      low-threshold: 3
    ip-account-window:
      seconds: 600
      threshold: 10
    ip-rate-window:
      seconds: 60
      threshold: 100
    # P9.4 两项。
    # instance-id **没有 @DefaultValue**：漏了就是绑定期失败。测试里写死一个字面量
    # 而不是 ${HOSTNAME}，这样 IT 能直接算出降级闸门键名（risk:event:gate:degraded:it-instance）
    # 去断言它的 TTL，不必反查环境变量。
    instance-id: it-instance
    # 时间窗聚合总开关。测试保持与生产默认一致（开）；要跑「关掉聚合」的对照用例
    # 自己用 @TestPropertySource 覆盖，不让「测试里聚合默认是关的」成为隐性前提。
    event-aggregation-enabled: true

  credit:
    # 测试库被各测试类共享，跑腿的在途任务会跨测试累积，
    # 上限放宽到 1000 避免 L2 资格校验干扰无关测试（生产保持 5）
    max-ongoing: 1000
    calibration-cron: "0 0 3 * * ?"
    calibration-batch-size: 1000
  cache:
    enabled: true
    shards: 4                 # 热 Key 分片数：读随机挑一片，失效时全片删
    ttl-seconds: 600          # 物理 TTL 10 分钟
    jitter-seconds: 120       # ±2 分钟随机抖动，防雪崩（大批 key 同时到期）
    empty-ttl-seconds: 60     # 空值缓存 TTL，防穿透
    double-delete-ms: 500     # 延迟双删间隔
    double-delete-enabled: true
    eviction-order: AFTER_COMMIT   # 生产恒为 AFTER_COMMIT；BEFORE_COMMIT 仅供对照实验
    bloom-enabled: true
    redisson-pool-size: 16    # 与 Lettuce 池分开，避免叠加打满 Redis
  web:
    cors-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.campusdash: INFO
